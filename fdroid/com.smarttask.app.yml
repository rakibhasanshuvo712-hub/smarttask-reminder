Summary: Smart Task Reminder & Deadline Alarms in Bangladesh Standard Time
Description: |
  SmartTask helps users manage daily tasks, set deadlines in Bangladesh Standard Time (Asia/Dhaka, UTC+06:00), and receive automatic high-priority native alarms on their phone before and after deadlines.

  Features:
  * Exclusively Asia/Dhaka Timezone (BST, UTC+6)
  * Native Phone Notifications & Lock-Screen Alarms (AlarmManager)
  * Multi-interval pre-deadline reminders (24h, 12h, 6h, 2h, 1h, 30m, 15m, 10m)
  * Automatic task deletion after deadline expiry option
  * Multi-user account privacy with Supabase PostgreSQL and local offline mode

